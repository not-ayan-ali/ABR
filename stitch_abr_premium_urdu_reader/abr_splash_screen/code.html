<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Entrance animation */
        .splash-enter {
            animation: fadeInScale 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: scale(0.95);
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>

<body class="bg-primary-container text-on-background min-h-screen flex items-center justify-center overflow-hidden">
<!-- Premium 1px Gold Border Frame -->
<div class="fixed inset-4 border border-secondary/30 pointer-events-none rounded"></div>
<main class="splash-enter flex flex-col items-center justify-center z-10 p-gutter">
<!-- Logo Image -->
<div class="flex flex-col items-center justify-center mb-8">
  
  <span style="font-family: 'Times New Roman', serif; font-size: 48px; font-weight: 700; color: #C5A059; letter-spacing: 0.1em; line-height: 1;" class="">ABR</span>
