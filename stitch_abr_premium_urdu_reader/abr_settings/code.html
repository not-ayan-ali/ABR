                        "outline": "#909098",
                        "secondary-fixed": "#ffdea5",
                        "secondary": "#e9c176",
                        "tertiary-fixed-dim": "#b9c6eb",
                        "surface-container-highest": "#2b3451",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#bfc5e4",
                        "surface-bright": "#2f3856",
                        "on-tertiary-fixed-variant": "#3a4665",
                        "surface-tint": "#bfc5e4",

                        "surface-container-high": "#202945",

                        "inverse-surface": "#dce1ff",

                        "surface-container": "#151e3a",
                        "on-background": "#dce1ff",

                        "surface-variant": "#2b3451",
                        "tertiary-fixed": "#d9e2ff",
                        "on-primary": "#292f48",
                        "primary": "#bfc5e4",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Slider Styling */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: theme('colors.secondary');
            cursor: pointer;
            border-radius: theme('borderRadius.full');
            border: 2px solid theme('colors.background');
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: theme('colors.surface-container-high');
            border-radius: theme('borderRadius.full');
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col pt-16 pb-20 md:pb-0 font-body-md text-body-md antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Top App Bar - Fixed -->
<header class="fixed top-0 w-full z-50 flex flex-row-reverse justify-between items-center px-margin-mobile h-16 bg-background dark:bg-background border-b border-outline-variant dark:border-outline-variant">
<button class="w-10 h-10 flex items-center justify-center text-on-background hover:bg-surface-variant rounded-full transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md text-secondary dark:text-secondary-fixed">ABR</h1>
<button class="w-10 h-10 flex items-center justify-center text-primary opacity-80 hover:bg-surface-variant rounded-full transition-colors">
<span class="material-symbols-outlined text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
</button>
</header>
<!-- Main Content Container -->
<main class="flex-grow w-full max-w-[720px] mx-auto px-margin-mobile py-8 space-y-6">
<!-- Header Section -->
<section class="mb-10 text-center">
<h2 class="font-headline-xl text-headline-xl text-on-background">ترتیبات</h2>
<div class="h-px w-24 bg-outline-variant mx-auto mt-2"></div>
</section>
<!-- Appearance Settings -->
<section class="bg-surface-container-low border border-outline-variant rounded-lg overflow-hidden">
<div class="px-6 py-4 border-b border-outline-variant bg-surface-container">
<h3 class="font-body-lg text-body-lg text-primary">ظاہری شکل</h3>
</div>
<div class="p-6 space-y-6">
<!-- Theme Toggle -->
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="text-on-surface">ڈارک موڈ</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-sans">Dark Mode</span>
</div>
<button class="relative inline-flex h-6 w-11 items-center rounded-full bg-surface-container-high border border-outline-variant transition-colors focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-background" id="themeToggle">
<span class="sr-only">Toggle Dark Mode</span>
<span class="translate-x-1 inline-block h-4 w-4 transform rounded-full bg-secondary transition-transform"></span>
</button>
</div>
<!-- Font Size Slider -->
<div class="pt-4 border-t border-outline-variant">
<div class="flex items-center justify-between mb-4">
<span class="text-on-surface">حروف کا سائز</span>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-sm">format_size</span>
</div>
</div>
<div class="flex items-center gap-4">
<span class="font-label-sm text-label-sm text-on-surface-variant font-sans">A</span>
<input class="w-full h-1 bg-surface-container-high rounded-full appearance-none outline-none" max="5" min="1" type="range" value="3"/>
<span class="font-headline-md text-headline-md text-on-surface font-sans">A</span>
</div>
</div>
</div>
</section>
<!-- Information Links -->
<section class="bg-surface-container-low border border-outline-variant rounded-lg overflow-hidden">
<div class="px-6 py-4 border-b border-outline-variant bg-surface-container">
<h3 class="font-body-lg text-body-lg text-primary">معلومات</h3>
</div>
<div class="flex flex-col divide-y divide-outline-variant">
<a class="flex items-center justify-between p-6 hover:bg-surface-container transition-colors group" href="#">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline group-hover:text-secondary transition-colors">info</span>
<span class="text-on-surface">ہمارے بارے میں</span>
</div>
<span class="material-symbols-outlined text-outline-variant rtl:-scale-x-100">chevron_left</span>
</a>
<a class="flex items-center justify-between p-6 hover:bg-surface-container transition-colors group" href="#">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline group-hover:text-secondary transition-colors">policy</span>
<span class="text-on-surface">رازداری کی پالیسی</span>
</div>
<span class="material-symbols-outlined text-outline-variant rtl:-scale-x-100">chevron_left</span>
</a>
</div>
</section>
<!-- Account Section (Logout) -->
<section class="pt-6">
<button class="w-full flex items-center justify-center gap-3 py-4 border border-error text-error rounded-lg hover:bg-error/10 transition-colors">
<span class="material-symbols-outlined">logout</span>
<span class="font-body-lg text-body-lg">لاگ آؤٹ</span>
</button>
</section>
</main>
<!-- Script for interactive elements -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            const toggleDot = themeToggle.querySelector('span.inline-block');

            // Initialize based on current class
            const isDark = html.classList.contains('dark');
            updateToggleState(isDark);

            themeToggle.addEventListener('click', () => {
                const willBeDark = !html.classList.contains('dark');
                html.classList.toggle('dark');
                updateToggleState(willBeDark);
            });

            function updateToggleState(isDark) {
                if (isDark) {
                    toggleDot.classList.add('translate-x-1');
                    toggleDot.classList.remove('-translate-x-4');
                    themeToggle.classList.add('bg-surface-container-highest');
                    themeToggle.classList.remove('bg-surface-container-high');
                } else {
                    toggleDot.classList.remove('translate-x-1');
                    toggleDot.classList.add('-translate-x-4');
                    themeToggle.classList.remove('bg-surface-container-highest');
                    themeToggle.classList.add('bg-surface-container-high');
                }
            }
        });
    </script>
</body></html>
