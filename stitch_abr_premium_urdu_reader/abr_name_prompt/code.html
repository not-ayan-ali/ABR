<style>
        /* Custom styles to handle specific editorial needs */
        .urdu-text {
            line-height: 2.2; /* Better line height for Nastaliq */
        }
        .input-focus-ring:focus {
            box-shadow: 0 0 0 1px theme('colors.secondary');
        }
        
        /* Subtle background pattern */
        .bg-pattern {
            background-image: radial-gradient(theme('colors.surface-container-highest') 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-secondary/30 selection:text-secondary">
<!-- Top App Bar (Semantic Shell - No Navigation for First Launch intent, but maintaining branding) -->
<header class="fixed top-0 w-full z-50 flex flex-row-reverse justify-center items-center px-margin-mobile h-16 border-b border-outline-variant bg-background/95 backdrop-blur-sm">
<h1 class="font-headline-md text-headline-md text-secondary">ABR</h1>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile relative pt-24 pb-12 overflow-hidden">
<!-- Subtle glowing orb effect in the background -->

<!-- Form Container -->
<div class="w-full max-w-[480px] bg-surface-container border border-outline-variant p-8 md:p-12 rounded flex flex-col items-center text-center relative z-10">
<!-- Icon/Ornament -->
<div class="mb-8 w-16 h-16 rounded-full border border-secondary flex items-center justify-center bg-surface-container-high text-secondary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-4 urdu-text w-full">خوش آمدید</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-10 urdu-text max-w-sm">
                اپنا نام درج کریں تاکہ ہم آپ کے مطالعے کا ریکارڈ رکھ سکیں
            </p>
<form class="w-full flex flex-col gap-8" onsubmit="event.preventDefault();">
<!-- Input Group -->
<div class="flex flex-col w-full text-right relative group">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-2 absolute -top-3 right-4 bg-surface-container px-2 z-10 transition-colors group-focus-within:text-secondary" for="username">نام</label>
<input autocomplete="off" class="w-full bg-surface-container-low border border-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary text-on-surface font-body-md text-body-md urdu-text px-4 py-4 rounded outline-none transition-all input-focus-ring placeholder:text-on-surface-variant/50" dir="rtl" id="username" name="username" placeholder="آپ کا نام" required="" type="text">
</div>
<!-- Primary CTA -->
<button class="w-full bg-secondary hover:bg-secondary-fixed text-on-secondary font-label-md text-label-md py-4 px-6 rounded transition-colors flex items-center justify-center gap-2 group" type="submit">
<span class="font-body-md text-body-md mt-1">شروع کریں</span>
<span class="material-symbols-outlined transform transition-transform group-hover:-translate-x-1">arrow_back</span>
</button>
</form>
<!-- Ornamental bottom divider -->
<div class="w-24 h-px bg-gradient-to-r from-transparent via-outline-variant to-transparent mt-12"></div>
</div>
</main>
<script>
        // Simple interaction to simulate button press
        document.querySelector('form').addEventListener('submit', function(e) {
            const btn = this.querySelector('button');
            const originalText = btn.innerHTML;
            
            // Visual feedback
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            // Simulate processing
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-80', 'pointer-events-none');
            }, 1000);
        });
    </script>


</body></html>
