<body class="bg-background text-on-background min-h-screen flex flex-col pb-24 relative overflow-x-hidden">
<!-- Ambient Background Lighting Effect -->

<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 flex flex-row-reverse justify-between items-center px-margin-mobile h-16 bg-background dark:bg-background border-b border-outline-variant dark:border-outline-variant">

<h1 class="font-headline-md text-headline-md text-secondary dark:text-secondary-fixed">ABR</h1>

<!-- Main Content Canvas -->

<div class="mb-8 border-b border-outline-variant pb-4">

</button>
</div>
</div>
<div class="p-3 bg-surface-container flex flex-col flex-grow">

<p class="font-body-md text-[14px] text-on-surface-variant line-clamp-1 mb-2">از قلم فاطمہ جناح</p>
<div class="mt-auto flex justify-between items-center">
<span class="inter-font text-label-sm text-on-surface-variant bg-surface-container px-2 py-0.5 rounded border border-outline-variant">Ch 42</span>
<div class="w-2 h-2 rounded-full bg-secondary"></div>
</div>
</div>
</article>
<!-- Card 2 -->

<button class="rounded-full p-1 border border-outline-variant text-secondary bg-surface-container-high">
<span class="material-symbols-outlined" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
</div>
</div>
<div class="p-3 bg-surface-container flex flex-col flex-grow">

<article class="bg-surface-container rounded border border-outline-variant hover:border-secondary transition-colors group cursor-pointer overflow-hidden flex flex-col">

<span class="material-symbols-outlined" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
</div>
</div>
<div class="p-3 bg-surface-container flex flex-col flex-grow">
<h3 class="font-headline-md text-[18px] leading-relaxed text-on-surface line-clamp-1 mb-1">وقت کی زنجیر</h3>
<p class="font-body-md text-[14px] text-on-surface-variant line-clamp-1 mb-2">علی رضا</p>
<div class="mt-auto flex justify-between items-center">
<span class="inter-font text-label-sm text-on-surface-variant bg-surface-container px-2 py-0.5 rounded border border-outline-variant">Ch 89</span>

<!-- Bottom Nav Bar -->

</a>
<!-- پسندیدہ (Favorites) - Active -->

<span class="material-symbols-outlined mb-1" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-body-md text-[12px] leading-none">پسندیدہ</span>
</a>
<!-- تلاش (Search) - Inactive -->

<span class="material-symbols-outlined mb-1" data-icon="search">search</span>
<span class="font-body-md text-[12px] leading-none">تلاش</span>
</a>
<!-- ہوم (Home) - Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors rounded-xl w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-body-md text-[12px] leading-none">ہوم</span>
